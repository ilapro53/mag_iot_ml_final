# Mosquitto — конфиг брокера IoT-фермы (вариант для Docker).
#
# Переносимость на Ubuntu-ВМ: этот же набор настроек кладётся в
#   /etc/mosquitto/conf.d/farm.conf, а пути меняются на системные:
#   password_file -> /etc/mosquitto/passwd, persistence_location -> /var/lib/mosquitto/
# (готовый скрипт миграции появится в scripts/ на этапе 5).

listener 1883
allow_anonymous false
# Файл паролей лежит в записываемом data-томе (конфиг монтируется read-only,
# туда писать нельзя). На Ubuntu-ВМ это будет /etc/mosquitto/passwd.
password_file /mosquitto/data/passwd

persistence true
persistence_location /mosquitto/data/

# Логи в stdout — видно через `docker compose logs mosquitto`
# (удобно для скриншота «брокер работает» и для отладки подключений).
log_dest stdout
log_type all
connection_messages true
