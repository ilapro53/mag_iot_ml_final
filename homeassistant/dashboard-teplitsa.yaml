# Дашборд Home Assistant для тепличной фермы.
#
# Как применить: открыть нужную панель -> режим редактирования (карандаш) ->
# меню (три точки) -> "Редактировать в YAML" (Raw configuration editor) -> вставить содержимое.
#
# Нужны сенсоры и переключатели из configuration.yaml. entity_id ожидаются:
# sensor.temperatura_teplitsy, sensor.vlazhnost_teplitsy, sensor.osveshchennost_teplitsy,
# sensor.osveshchennost_snaruzhi (свет снаружи), sensor.co2_teplitsy, sensor.pogoda_v_teplitse,
# switch.obogrev_teplitsy, switch.provetrivanie_teplitsy, switch.dosvetka_teplitsy.
# Если HA присвоил другие - поправить ниже.
#
# Раскладка: гейджи (Сейчас), переключатели актуаторов (Управление), баннер погоды,
# графики истории за сутки (свет внутри/снаружи в одном, актуаторы полосами).

views:
  - type: sections
    title: Теплица
    sections:
      - type: grid
        column_span: 4
        cards:
          - type: heading
            heading: Сейчас
          - type: gauge
            entity: sensor.temperatura_teplitsy
            name: Температура
            min: 10
            max: 35
            needle: true
            severity:
              green: 18
              yellow: 28
              red: 31
            grid_options:
              columns: 12
          - type: gauge
            entity: sensor.vlazhnost_teplitsy
            name: Влажность
            min: 35
            max: 90
            needle: true
            severity:
              green: 50
              yellow: 80
              red: 85
            grid_options:
              columns: 12
          - type: gauge
            entity: sensor.osveshchennost_teplitsy
            name: Освещенность
            min: 0
            max: 70000
            needle: true
            severity:
              green: 5000
              yellow: 50000
              red: 62000
            grid_options:
              columns: 12
          - type: gauge
            entity: sensor.co2_teplitsy
            name: CO2
            min: 400
            max: 1500
            needle: true
            severity:
              green: 400
              yellow: 1200
              red: 1400
            grid_options:
              columns: 12
      - type: grid
        column_span: 4
        cards:
          - type: heading
            heading: Управление (актуаторы)
          - type: tile
            entity: switch.obogrev_teplitsy
            name: Обогрев
            grid_options:
              columns: 16
          - type: tile
            entity: switch.provetrivanie_teplitsy
            name: Проветривание
            grid_options:
              columns: 16
          - type: tile
            entity: switch.dosvetka_teplitsy
            name: Досветка
            grid_options:
              columns: 16
      - type: grid
        column_span: 4
        cards:
          - type: markdown
            content: >
              <h1 style="text-align: center; font-size: 2.6em; margin: 18px 0;">{{
              states('sensor.pogoda_v_teplitse') }}</h1>
            grid_options:
              columns: full
      - type: grid
        column_span: 4
        cards:
          - type: heading
            heading: История за день
          - type: history-graph
            title: Температура
            entities:
              - entity: sensor.temperatura_teplitsy
            hours_to_show: 24
            grid_options:
              columns: 24
              rows: 6
          - type: history-graph
            title: Влажность
            entities:
              - entity: sensor.vlazhnost_teplitsy
            hours_to_show: 24
            grid_options:
              columns: 24
              rows: 6
          - type: history-graph
            title: Освещенность внутри и снаружи
            entities:
              - entity: sensor.osveshchennost_teplitsy
              - entity: sensor.osveshchennost_snaruzhi
            hours_to_show: 24
            grid_options:
              columns: 24
              rows: 6
          - type: history-graph
            title: CO2
            entities:
              - entity: sensor.co2_teplitsy
            hours_to_show: 24
            grid_options:
              columns: 24
              rows: 6
          - type: history-graph
            title: Актуаторы (вкл/выкл)
            entities:
              - entity: switch.obogrev_teplitsy
              - entity: switch.provetrivanie_teplitsy
              - entity: switch.dosvetka_teplitsy
            hours_to_show: 24
            grid_options:
              columns: 48
              rows: 3
    badges:
      - type: entity
        entity: sensor.pogoda_v_teplitse
      - type: entity
        entity: sensor.temperatura_teplitsy
      - type: entity
        entity: sensor.vlazhnost_teplitsy
      - type: entity
        entity: sensor.osveshchennost_teplitsy
      - type: entity
        entity: sensor.co2_teplitsy
