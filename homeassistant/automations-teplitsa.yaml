# Автоматизации Home Assistant для тепличной фермы (логика актуаторов).
#
# Это содержимое файла /config/automations.yaml (формат - список, каждый элемент с "-").
# Самый надежный способ применить (когда "Перезагрузить автоматизации" виснет по таймауту):
#   1) File editor -> открыть /config/automations.yaml -> вставить ВСЁ это (заменить содержимое).
#   2) Сохранить.
#   3) Настройки -> Система -> Перезапустить (полный рестарт HA читает файл с нуля, без таймаута).
#
# entity_id могут отличаться (HA транслитерирует имена) - проверь в Состояниях и поправь.
# Пороги с гистерезисом (вкл при одном значении, выкл при другом), чтобы актуаторы не дребезжали.
# for: 5 секунд на триггерах - антидребезг: значение должно продержаться за порогом, иначе
# одиночный всплеск не сработает. Для реального времени можно увеличить (напр. минуты).

# --- Обогрев: держим температуру 18..22 ---
- id: farm_heater_on
  alias: "Теплица: обогрев вкл"
  description: "Холодно - включить обогрев"
  mode: single
  triggers:
    - trigger: numeric_state
      entity_id: sensor.temperatura_teplitsy
      below: 18
      for:
        seconds: 5
  conditions: []
  actions:
    - action: switch.turn_on
      target:
        entity_id: switch.obogrev_teplitsy

- id: farm_heater_off
  alias: "Теплица: обогрев выкл"
  description: "Прогрелось - выключить обогрев"
  mode: single
  triggers:
    - trigger: numeric_state
      entity_id: sensor.temperatura_teplitsy
      above: 22
      for:
        seconds: 5
  conditions: []
  actions:
    - action: switch.turn_off
      target:
        entity_id: switch.obogrev_teplitsy

# --- Проветривание: при высокой влажности, CO2 или жаре; выкл когда все успокоилось ---
- id: farm_vent_on
  alias: "Теплица: проветривание вкл"
  description: "Душно (влажность/CO2/жара) - проветрить"
  mode: single
  triggers:
    - trigger: numeric_state
      entity_id: sensor.vlazhnost_teplitsy
      above: 80
      for:
        seconds: 5
    - trigger: numeric_state
      entity_id: sensor.co2_teplitsy
      above: 1200
      for:
        seconds: 5
    - trigger: numeric_state
      entity_id: sensor.temperatura_teplitsy
      above: 28
      for:
        seconds: 5
  conditions: []
  actions:
    - action: switch.turn_on
      target:
        entity_id: switch.provetrivanie_teplitsy

- id: farm_vent_off
  alias: "Теплица: проветривание выкл"
  description: "Влажность, CO2 и температура в норме - закрыть"
  mode: single
  triggers:
    - trigger: numeric_state
      entity_id: sensor.vlazhnost_teplitsy
      below: 70
      for:
        seconds: 5
    - trigger: numeric_state
      entity_id: sensor.co2_teplitsy
      below: 1000
      for:
        seconds: 5
    - trigger: numeric_state
      entity_id: sensor.temperatura_teplitsy
      below: 26
      for:
        seconds: 5
  conditions:
    - condition: numeric_state
      entity_id: sensor.vlazhnost_teplitsy
      below: 70
    - condition: numeric_state
      entity_id: sensor.co2_teplitsy
      below: 1000
    - condition: numeric_state
      entity_id: sensor.temperatura_teplitsy
      below: 26
  actions:
    - action: switch.turn_off
      target:
        entity_id: switch.provetrivanie_teplitsy

# --- Досветка: внутри темно И снаружи света не хватает; выкл когда снаружи светло ---
- id: farm_lamp_on
  alias: "Теплица: досветка вкл"
  description: "Темно внутри и снаружи мало света - включить лампу"
  mode: single
  triggers:
    - trigger: numeric_state
      entity_id: sensor.osveshchennost_teplitsy
      below: 6000
      for:
        seconds: 5
  conditions:
    - condition: numeric_state
      entity_id: sensor.osveshchennost_snaruzhi
      below: 9000
  actions:
    - action: switch.turn_on
      target:
        entity_id: switch.dosvetka_teplitsy

- id: farm_lamp_off
  alias: "Теплица: досветка выкл"
  description: "Снаружи стало светло - выключить лампу"
  mode: single
  triggers:
    - trigger: numeric_state
      entity_id: sensor.osveshchennost_snaruzhi
      above: 14000
      for:
        seconds: 5
  conditions: []
  actions:
    - action: switch.turn_off
      target:
        entity_id: switch.dosvetka_teplitsy
