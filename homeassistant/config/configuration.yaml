# Home Assistant - конфигурация IoT-фермы.
#
# Подключение к брокеру MQTT добавляется ОДИН раз через интерфейс:
#   Настройки, Устройства и службы, Добавить интеграцию, MQTT,
#   хост: mosquitto, порт: 1883, логин: mqtt_exp, пароль: pass_mqtt
# (контейнеры видят брокер по имени сервиса 'mosquitto'; на ВМ - по IP).
#
# Ниже - 5 числовых сенсоров (вкл. свет снаружи), текстовый сенсор погоды и 3 переключателя-
# актуатора (обогрев, проветривание, досветка). Подписка на топики farm/ilya/<датчик>, JSON.
# state_class: measurement включает долговременную статистику и графики в "Истории".
# Логику вкл/выкл актуаторов задают автоматизации Home Assistant (раздел Настройки -> Автоматизации).

default_config:

mqtt:
  sensor:
    - name: "Температура теплицы"
      unique_id: farm_ilya_temperature
      state_topic: "farm/ilya/temperature"
      value_template: "{{ value_json.value }}"
      unit_of_measurement: "°C"
      device_class: temperature
      state_class: measurement

    - name: "Влажность теплицы"
      unique_id: farm_ilya_humidity
      state_topic: "farm/ilya/humidity"
      value_template: "{{ value_json.value }}"
      unit_of_measurement: "%"
      device_class: humidity
      state_class: measurement

    - name: "Освещенность теплицы"
      unique_id: farm_ilya_light
      state_topic: "farm/ilya/light"
      value_template: "{{ value_json.value }}"
      unit_of_measurement: "lx"
      device_class: illuminance
      state_class: measurement

    - name: "Освещенность снаружи"
      unique_id: farm_ilya_light_out
      state_topic: "farm/ilya/light_out"
      value_template: "{{ value_json.value }}"
      unit_of_measurement: "lx"
      device_class: illuminance
      state_class: measurement

    - name: "CO2 теплицы"
      unique_id: farm_ilya_co2
      state_topic: "farm/ilya/co2"
      value_template: "{{ value_json.value }}"
      unit_of_measurement: "ppm"
      device_class: carbon_dioxide
      state_class: measurement

    # Погода берется из поля weather того же payload (свой топик ей не нужен).
    - name: "Погода в теплице"
      unique_id: farm_ilya_weather
      state_topic: "farm/ilya/temperature"
      value_template: "{{ value_json.weather }}"
      icon: mdi:weather-partly-cloudy

  # Актуаторы. HA-автоматизации шлют ON/OFF в command_topic, эмулятор применяет эффект
  # к модели и отвечает состоянием в state_topic (его и показывает переключатель).
  switch:
    - name: "Обогрев теплицы"
      unique_id: farm_ilya_heater
      command_topic: "farm/ilya/heater/set"
      state_topic: "farm/ilya/heater"
      payload_on: "ON"
      payload_off: "OFF"
      icon: mdi:radiator

    - name: "Проветривание теплицы"
      unique_id: farm_ilya_vent
      command_topic: "farm/ilya/vent/set"
      state_topic: "farm/ilya/vent"
      payload_on: "ON"
      payload_off: "OFF"
      icon: mdi:fan

    - name: "Досветка теплицы"
      unique_id: farm_ilya_lamp
      command_topic: "farm/ilya/lamp/set"
      state_topic: "farm/ilya/lamp"
      payload_on: "ON"
      payload_off: "OFF"
      icon: mdi:lightbulb
