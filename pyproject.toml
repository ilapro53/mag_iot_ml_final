[project]
name = "iot-farm-final"
version = "0.1.0"
description = "Зачётная работа IoT: MQTT-брокер + датчик-эмулятор + Home Assistant + визуализация"
requires-python = ">=3.10"
dependencies = [
    "paho-mqtt>=2.0",
    "matplotlib>=3.7",
]

# Это набор скриптов (датчик, визуализатор), а не устанавливаемый пакет —
# поэтому uv не пытается собрать корень проекта, только создаёт окружение с зависимостями.
[tool.uv]
package = false
